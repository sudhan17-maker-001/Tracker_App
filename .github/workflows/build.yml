name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: cd IncomeExpenseTracker_AndroidApp && chmod +x gradlew
    - name: Build with Gradle
      run: cd IncomeExpenseTracker_AndroidApp && ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: IncomeExpenseTracker_AndroidApp/app/build/outputs/apk/debug/app-debug.apk
